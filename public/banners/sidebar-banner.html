<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner 300x250</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
    }
    
    .banner {
      width: 300px;
      height: 250px;
      background: linear-gradient(135deg, #8B1538 0%, #6B0F2A 50%, #4A0A1C 100%);
      position: relative;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    /* Animated background circles */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.1;
    }
    
    .circle-1 {
      width: 150px;
      height: 150px;
      background: #FFD700;
      top: -50px;
      left: -50px;
      animation: float 6s ease-in-out infinite;
    }
    
    .circle-2 {
      width: 100px;
      height: 100px;
      background: #FFF;
      bottom: -30px;
      right: -30px;
      animation: float 8s ease-in-out infinite reverse;
    }
    
    .circle-3 {
      width: 80px;
      height: 80px;
      background: #FFD700;
      top: 50%;
      right: -20px;
      animation: pulse 4s ease-in-out infinite;
    }
    
    /* Megaphone icon */
    .icon-container {
      position: relative;
      z-index: 10;
      margin-bottom: 15px;
      animation: bounce 2s ease-in-out infinite;
    }
    
    .megaphone {
      width: 60px;
      height: 60px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }
    
    /* Sparkles */
    .sparkle {
      position: absolute;
      font-size: 20px;
      animation: sparkleAnim 2s ease-in-out infinite;
    }
    
    .sparkle-1 {
      top: 10px;
      left: 20px;
      animation-delay: 0s;
    }
    
    .sparkle-2 {
      top: 20px;
      right: 30px;
      animation-delay: 0.7s;
    }
    
    .sparkle-3 {
      bottom: 60px;
      left: 25px;
      animation-delay: 1.4s;
    }
    
    /* Text content */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      color: white;
    }
    
    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
      line-height: 1.3;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      animation: fadeInScale 1s ease-out;
    }
    
    .subtitle {
      font-size: 13px;
      margin-bottom: 18px;
      opacity: 0.95;
      animation: fadeIn 1.5s ease-out;
    }
    
    /* WhatsApp Button */
    .whatsapp-btn {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      animation: pulseButton 2s ease-in-out infinite;
      transition: transform 0.3s ease;
    }
    
    .whatsapp-btn:hover {
      transform: scale(1.05);
    }
    
    .whatsapp-icon {
      width: 20px;
      height: 20px;
      fill: white;
    }
    
    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.1; }
      50% { transform: scale(1.3); opacity: 0.2; }
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes sparkleAnim {
      0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(180deg); }
    }
    
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 0.95; }
    }
    
    @keyframes pulseButton {
      0%, 100% { box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }
      50% { box-shadow: 0 6px 25px rgba(37, 211, 102, 0.6); }
    }
  </style>
</head>
<body>
  <div class="banner">
    <!-- Background circles -->
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
    <div class="bg-circle circle-3"></div>
    
    <!-- Sparkles -->
    <span class="sparkle sparkle-1">✨</span>
    <span class="sparkle sparkle-2">💫</span>
    <span class="sparkle sparkle-3">⭐</span>
    
    <!-- Icon -->
    <div class="icon-container">
      <svg class="megaphone" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 13C19.6569 13 21 11.6569 21 10C21 8.34315 19.6569 7 18 7M11 5.88235V18.2353C11 19.2059 11 19.6912 10.7485 19.9428C10.497 20.1943 10.0117 20.1943 9.04118 20.1943C8.07059 20.1943 7.58529 20.1943 7.33382 19.9428C7.08235 19.6912 7.08235 19.2059 7.08235 18.2353V5.88235M11 5.88235C11 5.88235 13.5 3 18 3V17C13.5 17 11 14.1176 11 14.1176M11 5.88235C11 5.88235 8.5 3 4 3V17C8.5 17 11 14.1176 11 14.1176M5 19.5L3.5 22.5M7 19.5L8.5 22.5" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="white"/>
      </svg>
    </div>
    
    <!-- Content -->
    <div class="content">
      <div class="title">
        Burada sizin<br>reklamınız ola bilər
      </div>
      <div class="subtitle">
        Peşəkar reklam xidməti
      </div>

        </svg>
        0503807787

    </div>
  </div>
</body>
</html>
